name: qfli_web
description: "QFLIWebForge：手机上的网页 IDE，本地静态服务器预览，console 输出回传到编辑器。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  qfli_studio_core:
    path: ../qfli_studio_core

  cupertino_icons: ^1.0.8
  path: ^1.9.1

dependency_overrides:
  re_editor:
    path: ../qfli_studio_core/vendor/re_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - vendor/nginx/LICENSE
    - vendor/nginx/android-glob/LICENSE
