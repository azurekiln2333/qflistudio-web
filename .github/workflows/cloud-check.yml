name: Cloud checks

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      core_ref:
        description: Full immutable qflistudio-core commit SHA
        required: false
        type: string
        default: 476a30acee21dc486ee2849dd8064a7be665e4d5
  workflow_call:
    inputs:
      core_ref:
        description: Full immutable qflistudio-core commit SHA
        required: false
        type: string
        default: 476a30acee21dc486ee2849dd8064a7be665e4d5

permissions:
  contents: read

concurrency:
  group: cloud-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Source, workflow and artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without a persisted token
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select comparison commit
        id: comparison
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            base="$PR_BASE"
          elif [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Source $(git rev-parse HEAD); comparing changes with $base."

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Parse Python and YAML; reject new artifacts and lint added Chinese violations
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
        run: python scripts/check_source_policy.py --base "$BASE_SHA"

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.0.0
        with:
          version: 1.7.12
          shellcheck: false
          pyflakes: false
          cache: false

  linux-flutter:
    name: Linux Flutter analyze and unit tests
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source without a persisted token
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Flutter test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev xvfb

      - name: Set up pinned application inputs
        id: app
        uses: ./.github/actions/setup-app-build
        with:
          platform: linux
          core-ref: ${{ inputs.core_ref || '476a30acee21dc486ee2849dd8064a7be665e4d5' }}
          build-native: 'false'
          precache: --linux

      - name: Build retained QuickJS library required by editor unit tests
        run: python scripts/build_web_syntax.py --platform linux --output build/native/web_syntax/linux

      - name: Analyze Flutter source and tests
        run: flutter analyze --no-pub lib test

      - name: Run Flutter unit tests
        run: xvfb-run --auto-servernum flutter test --no-pub --concurrency=1

      - name: Record immutable cloud inputs
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          CORE_SHA: ${{ steps.app.outputs.core-commit }}
          FLUTTER_SHA: ${{ steps.app.outputs.flutter-commit }}
        run: |
          {
            echo '### Cloud Flutter check inputs'
            echo
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- qflistudio-core commit: \`${CORE_SHA:-not resolved}\`"
            echo "- Flutter fork commit: \`${FLUTTER_SHA:-not resolved}\`"
          } >> "$GITHUB_STEP_SUMMARY"
