daemon off;
master_process off;
worker_processes 1;
pid nginx-smoke.pid;
error_log stderr;
events {
    worker_connections 32;
}
http {
    access_log access-smoke.log;
    server {
        listen 127.0.0.1:18479;
        root /mnt/d/MyNewProjects/qfli_web/build/native/platform-audit/nginx-linux/site;
        location /proxy/ {
            proxy_pass http://127.0.0.1:18480/;
        }
    }
    server {
        listen 127.0.0.1:18480;
        root /mnt/d/MyNewProjects/qfli_web/build/native/platform-audit/nginx-linux/site;
        add_header X-Qfli-Upstream native;
    }
}
